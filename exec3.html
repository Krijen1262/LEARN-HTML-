<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Tables</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        caption {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption>User Information Table</caption>

        <!-- Table Header -->
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <!-- Table Rows -->
        <tr>
            <td>Krijen Shahi</td>
            <td>25</td>
            <td>Satdobato, Lalitpur</td>
        </tr>

        <tr>
            <td>Jivan Tamang</td>
            <td>30</td>
            <td>Balkot</td>
        </tr>

        <!-- Merged Cells -->
        <tr>
            <td colspan="2">Sita Bhattarai (Age not disclosed)</td>
            <td>Nepalgunj</td>
        </tr>

    </table>

</body>
</html>
